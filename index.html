<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8fd3f4" />
    <meta
      name="description"
      content="KJ Holiday is coming soon — a coastal getaway is on the horizon."
    />
    <title>KJ Holiday | Coming Soon</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui,
          sans-serif;
        color: #194963;
        background: #fff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        background: linear-gradient(
          180deg,
          #69bee9 0%,
          #a9dcf5 26%,
          #e3f4fc 48%,
          #fff 66%,
          #fff 100%
        );
      }

      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(2rem, 5vw, 4.5rem) 1.25rem;
        text-align: center;
      }

      .coming-soon {
        width: min(100%, 52rem);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 0.2rem;
        color: #176588;
        font-size: clamp(0.72rem, 1.4vw, 0.9rem);
        font-weight: 750;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #123f57;
        font-size: clamp(2.3rem, 7vw, 4.75rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
        text-wrap: balance;
      }

      .artwork {
        display: block;
        width: min(100%, 45rem);
        height: auto;
        margin: clamp(0.75rem, 2vw, 1.5rem) auto 0;
        filter: drop-shadow(0 1.1rem 1.2rem rgb(28 91 118 / 0.08));
      }

      .message {
        max-width: 34rem;
        margin: -0.4rem auto 0;
        color: #397085;
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        line-height: 1.6;
        text-wrap: balance;
      }

      @media (max-height: 720px) and (orientation: landscape) {
        main {
          padding-block: 1.5rem;
        }

        .artwork {
          width: min(58vh, 34rem);
          margin-top: 0.25rem;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .coming-soon {
          animation: arrive 700ms ease-out both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(0.75rem);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="coming-soon" aria-labelledby="page-title">
        <p class="eyebrow">A coastal escape is on the horizon</p>
        <h1 id="page-title">Coming Soon</h1>
        <img
          class="artwork"
          src="kjholiday-house-beach-transparent.png"
          alt="A claymation beach house beside turquoise waves"
          width="1254"
          height="1254"
        />
        <p class="message">
          We’re preparing something special by the shore. Check back soon.
        </p>
      </section>
    </main>
  </body>
</html>
